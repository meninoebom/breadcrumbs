[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "breadcrumbs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "anthropic>=0.52.0",
    "dotenv>=0.9.9",
    "email-validator>=2.1.0",
    "fastapi[standard]~=0.120.1",
    "mistune>=3.1.0",
    "psycopg[binary]>=3.2.12",
    "pydantic>=2.12.3",
    "resend>=2.7.0",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.27",
    "pyjwt>=2.8.0",
    "tenacity>=9.1.0",
    "apscheduler>=3.11.2",
    "boto3>=1.35.0",
]

[project.scripts]
dev = "app.cli:dev"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
